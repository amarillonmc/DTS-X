services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      PORT: 3000
      AUTO_SETUP: 1
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - game-state:/app/var
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3
    stop_grace_period: 3m
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-dtsx}
      MARIADB_USER: ${DB_USER:-dtsx}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run node scripts/configure.mjs first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run node scripts/configure.mjs first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  game-state:
  database:
